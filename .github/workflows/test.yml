name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/boettiger-lab/datasets:latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install package and test dependencies
      run: |
        uv pip install -e ".[dev,raster]"

    # rashid, the Portolan validator, in its own virtualenv: it needs rasterio,
    # pyproj and shapely, which the image builds against its one GDAL (#285),
    # and installing it beside them could replace them with wheels (#340).
    - name: Install rashid for the conformance test
      run: |
        uv venv /opt/rashid
        uv pip install --python /opt/rashid/bin/python rashid==0.4.0
    
    - name: Run tests
      env:
        RASHID: /opt/rashid/bin/rashid
      run: |
        pytest tests/ -v --cov=cng_datasets --cov-report=term
    
    - name: Show test summary
      run: |
        echo "Test Summary:"
        pytest tests/ --co -q | tail -1

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff
    
    - name: Lint with ruff
      run: |
        ruff check cng_datasets/ --select E,F,W --ignore E501
